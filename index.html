  /* Tweaks panel */

<script type="text/babel" data-presets="env,react">
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

</script>

        borderRadius: 12, padding: '12px 14px',
        fontSize: 14, color: value ? t.text : t.textMuted,
      }}>{value || placeholder}</div>
    </div>
  );

  const SelectRow = ({ label, options, val, onSelect }) => (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: t.textMid, marginBottom: 8 }}>{label}</div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {options.map(o => (
          <button key={o} onClick={() => onSelect(o)} style={{
            padding: '8px 14px', borderRadius: 100,
            border: `1.5px solid ${val === o ? t.accent : t.border}`,
            background: val === o ? t.accentLight : t.card,
            color: val === o ? t.accent : t.textMid,
            fontSize: 13, fontWeight: val === o ? 600 : 400, cursor: 'pointer', fontFamily: 'DM Sans',
          }}>{o}</button>
        ))}
      </div>
    </div>
  );

  const stepContent = [
    // Step 1: When
    <div key={1}>
      <div style={{ fontSize: 16, fontWeight: 700, color: t.text, marginBottom: 4 }}>When is the shift?</div>
      <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 20 }}>Set the date and time for this shift</div>
      <Field label="DATE" value={form.date} placeholder="Select date"/>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <Field label="START TIME" value={form.time} placeholder="Start"/>
        <Field label="END TIME" value={form.endTime} placeholder="End"/>
      </div>
      <SelectRow
        label="SHIFT TYPE"
        options={['Full day', 'Morning', 'Afternoon']}
        val="Full day"
        onSelect={() => {}}
      />
    </div>,
    // Step 2: Who
    <div key={2}>
      <div style={{ fontSize: 16, fontWeight: 700, color: t.text, marginBottom: 4 }}>What role do you need?</div>
      <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 20 }}>Tell educators what you're looking for</div>
      <SelectRow
        label="CLASS LEVEL"
        options={['Toddler (18m–3)', 'Casa (3–6)', 'Primary (6–9)', 'Primary (9–12)']}
        val={form.level}
        onSelect={v => setForm(f => ({ ...f, level: v }))}
      />
      <SelectRow
        label="REASON FOR SHIFT"
        options={['Teacher illness', 'PD day', 'Parental leave', 'Other']}
        val={form.reason || 'Teacher illness'}
        onSelect={v => setForm(f => ({ ...f, reason: v }))}
      />
    </div>,
    // Step 3: Details
    <div key={3}>
      <div style={{ fontSize: 16, fontWeight: 700, color: t.text, marginBottom: 4 }}>Additional details</div>
      <div style={{ fontSize: 13, color: t.textMuted, marginBottom: 20 }}>Help educators prepare for the shift</div>
      <Field label="PAY RATE" value="$38/hr" placeholder="Enter pay rate"/>
      <Field label="REQUIREMENTS" value="" placeholder="e.g. AMI trained, WWCC required…"/>
      <Field label="NOTES FOR EDUCATOR" value="" placeholder="Any extra info they should know…"/>
      {/* Summary */}
      <div style={{ background: t.accentLight, borderRadius: 12, padding: '14px', marginTop: 8 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: t.accent, marginBottom: 8 }}>SHIFT SUMMARY</div>
        {[
          ['Date', form.date],
          ['Time', `${form.time} – ${form.endTime}`],
          ['Level', form.level],
          ['Pay', '$38/hr'],
        ].map(([k, v]) => (
          <div key={k} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 4 }}>
            <span style={{ color: t.textMid }}>{k}</span>
            <span style={{ color: t.text, fontWeight: 600 }}>{v}</span>
          </div>
        ))}
      </div>
    </div>,
  ];

  return (
    <div style={{ background: t.bg, minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ background: t.card, borderBottom: `1px solid ${t.border}`, padding: '56px 16px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
          <button onClick={onBack} style={{
            background: t.bg, border: `1px solid ${t.border}`, borderRadius: 10, width: 36, height: 36,
            display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
          }}>
            <Icon name="chevron-left" size={18} color={t.text}/>
          </button>
          <span style={{ fontSize: 17, fontWeight: 600, color: t.text }}>Post a Shift</span>
        </div>
        {/* Progress */}
        <div style={{ display: 'flex', gap: 6 }}>
          {Array.from({ length: totalSteps }, (_, i) => (
            <div key={i} style={{
              flex: 1, height: 4, borderRadius: 100,
              background: i < step ? t.accent : t.border,
              transition: 'background 0.3s',
            }}/>
          ))}
        </div>
        <div style={{ fontSize: 11, color: t.textMuted, marginTop: 6 }}>Step {step} of {totalSteps}</div>
      </div>

      <div style={{ flex: 1, overflow: 'auto', padding: '20px 16px 100px' }}>
        {stepContent[step - 1]}
      </div>

      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        background: t.navBg, backdropFilter: 'blur(16px)',
        padding: '14px 16px 34px', borderTop: `1px solid ${t.border}`,
      }}>
        <button onClick={() => { if (step < totalSteps) setStep(s => s + 1); else onDone(); }} style={{
          width: '100%', background: t.accent, color: '#fff',
          border: 'none', borderRadius: 14, padding: '16px',
          fontSize: 16, fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans',
        }}>
          {step < totalSteps ? 'Continue' : 'Post Shift'}
        </button>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('floatly-tweaks') || '{}');
      return { ...TWEAK_DEFAULTS, ...saved };
    } catch { return TWEAK_DEFAULTS; }
  });
  const [showTweaks, setShowTweaks] = React.useState(false);

  const t = THEMES[tweaks.theme];

  // Navigation
  const [role, setRole] = React.useState(null); // null = role select
  const [educatorTab, setEducatorTab] = React.useState('browse');
  const [schoolTab, setSchoolTab] = React.useState('dashboard');
  const [selectedShift, setSelectedShift] = React.useState(null);
  const [schoolScreen, setSchoolScreen] = React.useState('dashboard'); // dashboard | post | manage | success

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    localStorage.setItem('floatly-tweaks', JSON.stringify(next));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: next.theme } }, '*');
  };

  React.useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  // Restore state
  React.useEffect(() => {
    try {
      const s = JSON.parse(localStorage.getItem('floatly-state') || '{}');
      if (s.role) setRole(s.role);
    } catch {}
  }, []);

  const setRoleAndSave = (r) => {
    setRole(r);
    localStorage.setItem('floatly-state', JSON.stringify({ role: r }));
  };

  // ── EDUCATOR CONTENT ──
  const educatorContent = () => {
    if (selectedShift) {
      return <ShiftDetail shift={selectedShift} t={t} onBack={() => setSelectedShift(null)} onApply={() => {}}/>;
    }
    if (educatorTab === 'browse') return <EducatorBrowse t={t} onShiftSelect={setSelectedShift}/>;
    if (educatorTab === 'saved') return (
      <div style={{ background: t.bg, minHeight: '100%', padding: '60px 20px', textAlign: 'center' }}>
        <Icon name="bookmark" size={40} color={t.textMuted} style={{ margin: '0 auto 12px', display: 'block' }}/>
        <div style={{ fontSize: 16, fontWeight: 600, color: t.text, marginBottom: 6 }}>Saved Shifts</div>
        <div style={{ fontSize: 13, color: t.textMuted }}>Shifts you bookmark will appear here</div>
      </div>
    );
    if (educatorTab === 'profile') return <EducatorProfile t={t}/>;
    return null;
  };

  // ── SCHOOL CONTENT ──
  const schoolContent = () => {
    if (schoolScreen === 'post') return <PostShift t={t} onBack={() => setSchoolScreen('dashboard')} onDone={() => setSchoolScreen('success')}/>;
    if (schoolScreen === 'success') return <ShiftPostedSuccess t={t} onBack={() => setSchoolScreen('dashboard')}/>;
    if (schoolScreen === 'manage') return <ManageApplicants t={t} onBack={() => setSchoolScreen('dashboard')}/>;
    return <SchoolDashboard t={t} onPost={() => setSchoolScreen('post')} onManage={() => setSchoolScreen('manage')}/>;
  };

  const educatorTabs = [
    { id: 'browse', label: 'Browse', icon: 'search' },
    { id: 'saved', label: 'Saved', icon: 'bookmark' },
    { id: 'profile', label: 'Profile', icon: 'person' },
  ];

  const schoolTabs = [
    { id: 'dashboard', label: 'Dashboard', icon: 'grid' },
    { id: 'post', label: 'Post Shift', icon: 'plus' },
  ];

  const renderPhone = (content, withNav = false, navTabs = [], activeTab = '', onTab = () => {}) => (
    <IOSDevice width={375} height={812} dark={false}>
      <div style={{ height: '100%', position: 'relative', overflow: 'hidden' }}>
        <div style={{ height: '100%', overflow: 'auto' }}>
          {content}
        </div>
        {withNav && !selectedShift && schoolScreen === 'dashboard' && (
          <BottomNav tabs={navTabs} active={activeTab} onTab={onTab} t={t}/>
        )}
        {withNav && role === 'educator' && !selectedShift && (
          <BottomNav tabs={navTabs} active={activeTab} onTab={onTab} t={t}/>
        )}
      </div>
    </IOSDevice>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 40, padding: '40px 20px' }}>
      {/* Label row */}
      <div style={{ display: 'flex', gap: 60, alignItems: 'flex-end' }}>
        {/* Phone 1: Role Select / Onboarding */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <IOSDevice width={375} height={812} dark={false}>
            <div style={{ height: '100%', overflow: 'auto' }}>
              <RoleSelect t={t} onSelect={setRoleAndSave}/>
            </div>
          </IOSDevice>
          <div style={{ color: '#999', fontSize: 12, fontFamily: 'DM Sans', fontWeight: 500 }}>Onboarding</div>
        </div>

        {/* Phone 2: Educator or School (main flow) */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          {role === null ? (
            <IOSDevice width={375} height={812} dark={false}>
              <div style={{ height: '100%', overflow: 'auto', background: t.bg, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ textAlign: 'center', padding: 32 }}>
                  <div style={{ fontSize: 14, color: t.textMuted, marginBottom: 8 }}>← Select a role</div>
                  <div style={{ fontSize: 13, color: t.textMuted }}>Tap a role on the left to explore</div>
                </div>
              </div>
            </IOSDevice>
          ) : role === 'educator' ? (
            <IOSDevice width={375} height={812} dark={false}>
              <div style={{ height: '100%', position: 'relative', overflow: 'hidden' }}>
                <div style={{ height: '100%', overflow: 'auto' }}>
                  {educatorContent()}
                </div>
                {!selectedShift && (
                  <BottomNav tabs={educatorTabs} active={educatorTab} onTab={setEducatorTab} t={t}/>
                )}
              </div>
            </IOSDevice>
          ) : (
            <IOSDevice width={375} height={812} dark={false}>
              <div style={{ height: '100%', position: 'relative', overflow: 'hidden' }}>
                <div style={{ height: '100%', overflow: 'auto' }}>
                  {schoolContent()}
                </div>
                {(schoolScreen === 'dashboard') && (
                  <BottomNav tabs={schoolTabs} active={schoolTab} onTab={(id) => { setSchoolTab(id); if (id === 'post') setSchoolScreen('post'); else setSchoolScreen('dashboard'); }} t={t}/>
                )}
              </div>
            </IOSDevice>
          )}
          <div style={{ color: '#999', fontSize: 12, fontFamily: 'DM Sans', fontWeight: 500 }}>
            {role === 'educator' ? 'Educator Flow' : role === 'school' ? 'School Flow' : 'Select role →'}
          </div>
        </div>

        {/* Phone 3: Secondary screen */}
        {role === 'educator' && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            <IOSDevice width={375} height={812} dark={false}>
              <div style={{ height: '100%', overflow: 'auto' }}>
                <EducatorProfile t={t}/>
              </div>
            </IOSDevice>
            <div style={{ color: '#999', fontSize: 12, fontFamily: 'DM Sans', fontWeight: 500 }}>Educator Profile</div>
          </div>
        )}
        {role === 'school' && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            <IOSDevice width={375} height={812} dark={false}>
              <div style={{ height: '100%', overflow: 'auto' }}>
                <ManageApplicants t={t} onBack={() => {}}/>
              </div>
            </IOSDevice>
            <div style={{ color: '#999', fontSize: 12, fontFamily: 'DM Sans', fontWeight: 500 }}>Manage Applicants</div>
          </div>
        )}
      </div>

      {/* Role switcher at bottom */}
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <span style={{ color: '#666', fontSize: 12, fontFamily: 'DM Sans' }}>View as:</span>
        {[
          { id: 'educator', label: 'Educator' },
          { id: 'school', label: 'School' },
        ].map(r => (
          <button key={r.id} onClick={() => { setRoleAndSave(r.id); setSelectedShift(null); setSchoolScreen('dashboard'); }} style={{
            padding: '8px 20px', borderRadius: 100,
            background: role === r.id ? '#fff' : 'transparent',
            color: role === r.id ? '#111' : '#888',
            border: role === r.id ? '1px solid #333' : '1px solid #444',
            fontSize: 13, fontWeight: role === r.id ? 600 : 400,
            cursor: 'pointer', fontFamily: 'DM Sans',
          }}>{r.label}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<!-- Tweaks Panel -->

  <div class="tweak-group">
    <div class="tweak-label">Color Theme</div>

      <div class="swatch active" id="sw-terra" style="background:#C4714A" title="Terracotta" onclick="setTheme('terra')"></div>
      <div class="swatch" id="sw-sage" style="background:#4E7C62" title="Sage" onclick="setTheme('sage')"></div>
      <div class="swatch" id="sw-navy" style="background:#3B5FA0" title="Navy" onclick="setTheme('navy')"></div>
    </div>
  </div>
</div>

<div id="root"></div>

<script>
function setTheme(name) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
  document.getElementById('sw-' + name)?.classList.add('active');
  window.__setTheme && window.__setTheme(name);
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: name } }, '*');
}

window.addEventListener('message', e => {
  if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').style.display = 'block';
  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').style.display = 'none';
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>
